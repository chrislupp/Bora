name: Publish to crates.io

# Publishes the crate when the release workflow creates a stable GitHub Release.
# Pre-releases are skipped: the release workflow leaves the pre-release qualifier
# out of Cargo.toml, so publishing one would claim the final version number.
#
# Authentication tries crates.io trusted publishing (OIDC) first and falls back to
# the CARGO_REGISTRY_TOKEN secret of the crates-io environment only if the OIDC
# exchange fails. A stale or revoked token therefore cannot block a release once
# trusted publishing is set up (v0.3.0 failed with 403 because the bootstrap token
# was still preferred over OIDC). Trusted publisher on crates.io (crate settings ->
# Trusted Publishing): repository chrislupp/Bora, workflow publish.yml, environment
# crates-io. Once it works, delete the secret and revoke the token.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    - uses: dtolnay/rust-toolchain@stable

    - name: Check the tag matches Cargo.toml
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
        if [ "v${VERSION}" != "${TAG}" ]; then
          echo "::error::Tag ${TAG} does not match Cargo.toml version ${VERSION}."
          exit 1
        fi

    - name: Test
      run: cargo test --all-features

    - name: Authenticate with crates.io (trusted publishing)
      id: auth
      continue-on-error: true
      uses: rust-lang/crates-io-auth-action@v1

    - name: Select the registry token
      env:
        OIDC_TOKEN: ${{ steps.auth.outputs.token }}
        SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        if [ -n "$OIDC_TOKEN" ]; then
          echo "Using trusted publishing."
          TOKEN="$OIDC_TOKEN"
        elif [ -n "$SECRET_TOKEN" ]; then
          echo "::warning::Trusted publishing failed; falling back to the CARGO_REGISTRY_TOKEN secret."
          TOKEN="$SECRET_TOKEN"
        else
          echo "::error::Trusted publishing failed and no CARGO_REGISTRY_TOKEN secret is set. Add a trusted publisher on crates.io (repository chrislupp/Bora, workflow publish.yml, environment crates-io)."
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Publish
      run: cargo publish
