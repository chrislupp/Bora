name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Three jobs, so that a failing Docker image blocks the release as in Scirocco:
#   prepare  version bump, changelog, docs snapshot; signed commit and tag, kept
#            local and handed on as a git bundle (nothing is pushed)
#   images   builds and smoke-tests the bora_server image for linux/amd64 and
#            linux/arm64 from that commit (docker-image.yml)
#   publish  only if both images passed: pushes the commit and tag to main, then
#            the tested images (unchanged) to Docker Hub, then the GitHub Release
#            (which triggers publish.yml for crates.io)

permissions:
  contents: write

# Serialize version calculation, commit, and tag publication.
concurrency:
  group: bora-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
    # ── Checkout ──────────────────────────────────────────────────────
    - name: Checkout merged candidate
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0

    - name: Require candidate to be current main
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"
        git checkout -B main "$CANDIDATE"

    # ── GPG setup for signed commits ─────────────────────────────────
    - name: Generate ephemeral GPG key
      run: |
        cat > /tmp/gpg-key-params <<GPGEOF
        %no-protection
        Key-Type: RSA
        Key-Length: 4096
        Subkey-Type: RSA
        Subkey-Length: 4096
        Name-Real: github-actions[bot]
        Name-Email: 41898282+github-actions[bot]@users.noreply.github.com
        Expire-Date: 1d
        GPGEOF
        gpg --batch --gen-key /tmp/gpg-key-params
        KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2)
        echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.signingkey "${KEY_ID}"
        git config commit.gpgsign true
        git config tag.gpgsign true

    # ── Extract and validate PR labels ───────────────────────────────
    - name: Extract labels
      id: labels
      env:
        LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
      run: |
        echo "Labels on PR: $LABELS"

        # Release type
        IS_RELEASE=false
        IS_PRERELEASE=false
        for l in $LABELS; do
          case "$l" in
            release)    IS_RELEASE=true ;;
            prerelease) IS_PRERELEASE=true ;;
          esac
        done

        if $IS_RELEASE && $IS_PRERELEASE; then
          echo "::error::PR must have exactly one of 'release' or 'prerelease', not both."
          exit 1
        fi

        # Version bump
        BUMP=""
        BUMP_COUNT=0
        for l in $LABELS; do
          case "$l" in
            major|minor|patch)
              BUMP="$l"
              BUMP_COUNT=$((BUMP_COUNT + 1))
              ;;
          esac
        done

        if [ "$BUMP_COUNT" -ne 1 ]; then
          echo "::error::PR must have exactly one of 'major', 'minor', or 'patch' labels."
          exit 1
        fi

        # Pre-release qualifier
        QUALIFIER=""
        QUAL_COUNT=0
        for l in $LABELS; do
          case "$l" in
            alpha|beta|rc)
              QUALIFIER="$l"
              QUAL_COUNT=$((QUAL_COUNT + 1))
              ;;
          esac
        done

        if $IS_PRERELEASE && [ "$QUAL_COUNT" -ne 1 ]; then
          echo "::error::Pre-release PRs must have exactly one of 'alpha', 'beta', or 'rc' labels."
          exit 1
        fi

        if $IS_RELEASE && [ "$QUAL_COUNT" -ne 0 ]; then
          echo "::error::Stable release PRs must not have 'alpha', 'beta', or 'rc' labels."
          exit 1
        fi

        echo "is_release=$IS_RELEASE"       >> "$GITHUB_OUTPUT"
        echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
        echo "bump=$BUMP"                   >> "$GITHUB_OUTPUT"
        echo "qualifier=$QUALIFIER"         >> "$GITHUB_OUTPUT"

    # ── Calculate new version ────────────────────────────────────────
    - name: Calculate version
      id: version
      run: |
        # Read current version from Cargo.toml
        CURRENT=$(grep -oP '^version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        echo "Current version: ${MAJOR}.${MINOR}.${PATCH}"

        BUMP="${{ steps.labels.outputs.bump }}"
        case "$BUMP" in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        if [ "${{ steps.labels.outputs.is_prerelease }}" = "true" ]; then
          QUALIFIER="${{ steps.labels.outputs.qualifier }}"

          # Find the latest pre-release tag for this version+qualifier
          PRERELEASE_NUM=1
          PATTERN="v${NEW_VERSION}-${QUALIFIER}."
          LATEST_TAG=$(git tag -l "${PATTERN}*" | sort -V | tail -n1 || true)
          if [ -n "$LATEST_TAG" ]; then
            PREV_NUM=$(echo "$LATEST_TAG" | grep -oP "${QUALIFIER}\.\K[0-9]+")
            PRERELEASE_NUM=$((PREV_NUM + 1))
          fi

          TAG_VERSION="v${NEW_VERSION}-${QUALIFIER}.${PRERELEASE_NUM}"
          IS_PRERELEASE=true
        else
          TAG_VERSION="v${NEW_VERSION}"
          IS_PRERELEASE=false
        fi

        echo "new_version=${NEW_VERSION}"     >> "$GITHUB_OUTPUT"
        echo "tag_version=${TAG_VERSION}"     >> "$GITHUB_OUTPUT"
        echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "New version: ${NEW_VERSION}, Tag: ${TAG_VERSION}"

    # ── Update copyright years and source version headers (stable releases only)
    - name: Update copyright years and version headers
      if: steps.labels.outputs.is_release == 'true'
      run: python3 scripts/update_copyright.py --version ${{ steps.version.outputs.new_version }} .

    # ── Update Cargo.toml version ────────────────────────────────────
    - name: Update Cargo.toml version
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        sed -i '0,/^version\s*=\s*"[0-9]\+\.[0-9]\+\.[0-9]\+"/s//version = "'"$NEW_VERSION"'"/' Cargo.toml

        # Record the new package version in Cargo.lock without touching dependencies.
        cargo update --workspace

        echo "Cargo.toml updated:"
        grep -m1 '^version' Cargo.toml

    # ── Update CHANGELOG.md ──────────────────────────────────────────
    - name: Update CHANGELOG.md
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${{ steps.version.outputs.new_version }}"
        DATE=$(date +%Y-%m-%d)
        REPO="https://github.com/${{ github.repository }}"

        if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
          HEADER="${TAG#v}"
        else
          HEADER="${VERSION}"
        fi

        # Replace [Unreleased] header with version header and add new [Unreleased]
        sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${HEADER}] - ${DATE}/" CHANGELOG.md

        # Update comparison links
        # Remove existing [Unreleased] link
        sed -i '/^\[Unreleased\]:/d' CHANGELOG.md

        # Add new links at the bottom
        echo "[Unreleased]: ${REPO}/compare/${TAG}...HEAD" >> CHANGELOG.md
        echo "[${HEADER}]: ${REPO}/releases/tag/${TAG}" >> CHANGELOG.md

    # ── Create docs version snapshot (stable releases only) ────────
    - name: Setup Node.js
      if: steps.labels.outputs.is_release == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Install docs dependencies
      if: steps.labels.outputs.is_release == 'true'
      run: npm ci
      working-directory: docs

    - name: Create docs version snapshot
      if: steps.labels.outputs.is_release == 'true'
      run: npx docusaurus docs:version ${{ steps.version.outputs.new_version }}
      working-directory: docs

    - name: Update docs default version
      if: steps.labels.outputs.is_release == 'true'
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        sed -i "s/lastVersion: \"[^\"]*\"/lastVersion: \"${VERSION}\"/" docs/docusaurus.config.ts

    # ── Commit and tag ───────────────────────────────────────────────
    - name: Commit release changes
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${TAG#v}"

        git add -A
        git commit -S -m "chore: release version ${VERSION}"

    - name: Create annotated tag
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        git tag -a "$TAG" -m "Release ${TAG}"

    # The commit and tag stay local until the images pass; the bundle carries
    # them to the other jobs.
    - name: Bundle the release commit and tag
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
        TAG: ${{ steps.version.outputs.tag_version }}
      run: |
        mkdir -p "$RUNNER_TEMP/bundle"
        git bundle create "$RUNNER_TEMP/bundle/release.bundle" main "refs/tags/$TAG" "^$CANDIDATE"
        git bundle verify "$RUNNER_TEMP/bundle/release.bundle"

    - uses: actions/upload-artifact@v4
      with:
        name: release-commit
        path: ${{ runner.temp }}/bundle/release.bundle
        if-no-files-found: error
        retention-days: 1

  images:
    needs: prepare
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      bundle: release-commit

  publish:
    needs: [prepare, images]
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout merged candidate
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - uses: actions/download-artifact@v4
      with:
        name: release-commit
        path: ${{ runner.temp }}/bundle

    - name: Restore the release commit and tag
      env:
        TAG: ${{ needs.prepare.outputs.tag_version }}
      run: |
        git fetch "$RUNNER_TEMP/bundle/release.bundle" \
          "main:refs/heads/release-candidate" "refs/tags/$TAG:refs/tags/$TAG"
        git checkout -B main release-candidate
        git log -1 --oneline

    # ── GPG setup for the signed merge back to develop────────────────────────────────
    - name: Generate ephemeral GPG key
      run: |
        cat > /tmp/gpg-key-params <<GPGEOF
        %no-protection
        Key-Type: RSA
        Key-Length: 4096
        Subkey-Type: RSA
        Subkey-Length: 4096
        Name-Real: github-actions[bot]
        Name-Email: 41898282+github-actions[bot]@users.noreply.github.com
        Expire-Date: 1d
        GPGEOF
        gpg --batch --gen-key /tmp/gpg-key-params
        KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2)
        echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.signingkey "${KEY_ID}"
        git config commit.gpgsign true
        git config tag.gpgsign true

    - name: Refuse publication if main advanced
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"

    - name: Push commit and tag
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
        TAG: ${{ needs.prepare.outputs.tag_version }}
      run: |
        git push --atomic --force-with-lease="refs/heads/main:$CANDIDATE" \
          origin HEAD:refs/heads/main "refs/tags/$TAG"

    # ── Publish the tested Docker images ─────────────────────────────
    - uses: actions/download-artifact@v4
      with:
        pattern: docker-image-*
        path: ${{ runner.temp }}/images
        merge-multiple: true

    - uses: imjasonh/setup-crane@v0.4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish the tested images without rebuilding
      env:
        TAG: ${{ needs.prepare.outputs.tag_version }}
      run: |
        version="${TAG#v}"
        tags=("$version")
        # Pre-releases get only their own tag; stable releases move the series tags.
        if [[ "$version" != *-* ]]; then
          tags+=("${version%.*}" "${version%%.*}" latest)
        fi
        bash scripts/publish_image.sh chrislupp/bora "$RUNNER_TEMP/images" "${tags[@]}"

    # ── Extract release notes ────────────────────────────────────────
    - name: Extract release notes
      id: notes
      run: |
        TAG="${{ needs.prepare.outputs.tag_version }}"
        VERSION="${TAG#v}"

        # Extract the section for this version from CHANGELOG.md
        NOTES=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]")) found=1
            next
          }
          found { print }
        ' CHANGELOG.md)

        # Write to file for the release action
        echo "$NOTES" > /tmp/release-notes.md
        echo "Release notes:"
        cat /tmp/release-notes.md

    # ── Create GitHub Release ────────────────────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.prepare.outputs.tag_version }}
        name: ${{ needs.prepare.outputs.tag_version }}
        body_path: /tmp/release-notes.md
        prerelease: ${{ needs.prepare.outputs.is_prerelease }}
        # Must be the PAT, passed as the `token` input: the input defaults to
        # github.token and overrides the GITHUB_TOKEN env var, and a release
        # created by github-actions[bot] does not trigger publish.yml.
        token: ${{ secrets.RELEASE_TOKEN }}

    # ── Merge back to develop ───────────────────────────────────────
    - name: Merge main back to develop
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        git fetch origin develop
        git checkout develop

        if git merge main --no-edit; then
          git push origin develop
          echo "Successfully merged main back to develop"
        else
          git merge --abort
          echo "::warning::Auto-merge failed due to conflicts. Creating PR."
          gh pr create \
            --base develop \
            --head main \
            --title "chore: merge release ${{ needs.prepare.outputs.tag_version }} back to develop" \
            --body "Automatic merge of release changes back to develop failed due to conflicts. Please resolve manually."
        fi
